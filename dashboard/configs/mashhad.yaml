# =============================================================================
# پیکربندی حوضه مشهد - چناران
# منابع داده: فقط Amar_SAD.xlsx ، CHAH_MASHAHD.xls ، PDFهای سیمای آب (پوشه Bilan) و شیپ‌فایل‌ها.
# برای یک حوضه جدید: این فایل را کپی کنید، مسیرها و نام ستون‌ها را عوض کنید و بخش‌هایی را
# که آن حوضه ندارد (مثلاً transfers) حذف کنید. همه مقادیر حجمی به میلیون مترمکعب هستند.
# =============================================================================

basin:
  key: mashhad
  name: محدوده مطالعاتی مشهد - چناران
  name_en: Mashhad–Chenaran study area   # نام انگلیسی (اختیاری)
  base_dir: ../..            # پوشه داده‌ها نسبت به همین فایل (D:\Term2\WERI\Water_Accounting)
  crs: EPSG:32640            # سیستم مختصات کاری (UTM 40N)

spatial:
  sub_basins:
    shapefile: shape/final_boundary_fixed.shp
    id_field: layer
  counties:
    shapefile: shape/shahrestan.shp
    name_field: PER_NAM
    fix_encoding: cp1256      # نام‌ها در این شیپ‌فایل با انکدینگ خراب ذخیره شده‌اند
  snap_distance_m: 5000       # چاه/سد بیرون از مرز تا این فاصله به نزدیک‌ترین پلیگون نسبت داده می‌شود
  sub_basin_label: "زیرحوضه {id}"
  river_reach_label: "بازه رودخانه {id}"
  aquifer_label: "آبخوان زیرحوضه {id}"

# مبنای پیش‌فرض شهرستان: attribute = ستون شهرستان در آمار چاه‌ها (شامل طرقبه-شاندیز و گلبهار)
#                         geo       = شیپ‌فایل شهرستان‌ها (فعلاً ۷ شهرستان قدیمی)
county_mode_default: attribute

# -----------------------------------------------------------------------------
# کاربری‌ها و قاعده آب برگشتی
#   return_coef     ضریب برگشت (برگشت کل = ضریب × مجموع برداشت گروه)
#   river_fraction  سهم برگشت که به بازه رودخانه می‌رود؛ باقی به آبخوان
#   return_group    county: برگشت هر شهرستان یکجا حساب و بین زیرحوضه‌ها به نسبت برداشت زیرزمینی پخش می‌شود
#                   sub_basin: برگشت هر زیرحوضه در همان زیرحوضه
#   breakdown       تفکیک ستون‌ها در «قالب اکسل»: county | sub_basin | none
#   members         شهرستان‌هایی که در قالب اکسل ستون دارند
#   treatment_fraction  سهمی از برگشت که خروجی تصفیه‌خانه گزارش می‌شود (فقط شرب مشهد)
# توجه: ضرایب صنعت (0.15) و خدمات (0.7) مطابق شیت DYNMIC اکسل نمونه است؛ در سیمای آب برعکس است
#       (صنعت 0.7، خدمات 0.15). در صورت نیاز اینجا یا از داخل داشبورد اصلاح کنید.
# -----------------------------------------------------------------------------
uses:
  - name: شرب
    return_coef: 0.7
    river_fraction: 0.5
    return_group: county
    breakdown: county
    members: [مشهد, چناران, طرقبه-شاندیز, گلبهار, قوچان]
    treatment_fraction: {مشهد: 0.5}
  - name: شرب روستایی
    return_coef: 0.15
    river_fraction: 0.5
    return_group: sub_basin
    breakdown: sub_basin
  - name: کشاورزی
    return_coef: 0.15
    river_fraction: 0
    return_group: sub_basin
    breakdown: sub_basin
  - name: صنعتی
    return_coef: 0.15
    river_fraction: 0.5
    return_group: county
    breakdown: county
    members: [مشهد, چناران, طرقبه-شاندیز, گلبهار, قوچان]
  - name: خدمات
    return_coef: 0.7
    river_fraction: 0.5
    return_group: sub_basin
    breakdown: sub_basin

# برگشتی رودخانه‌ای کاربری‌های شهرستانی به کدام بازه می‌رود (مثلاً نصف برگشت شرب مشهد -> بازه 4)
# شهرستانی که اینجا نیست به زیرحوضه‌ای می‌رود که بیشترین برداشت را در آن دارد.
county_outlet_reach:
  مشهد: 4
  چناران: 2
  طرقبه-شاندیز: 3
  گلبهار: 3
  قوچان: 1

# منابعی که در «کنترل بیلان» جمع می‌شوند (تصفیه‌خانه و بازه‌ها جزو آن نیستند)
balance_source_groups: [dam, gw, transfer]
treatment_label: تصفیه خانه

# -----------------------------------------------------------------------------
# سیمای آب: جدول اول (بیلان آب محدوده مطالعاتی) همه PDFهای این پوشه
#   تجدیدپذیر سطحی (رواناب)، تجدیدپذیر زیرزمینی (نفوذ)، تغییر ذخیره آبخوان (کسری مخزن)
#   و «آب انتقالی جهت مصرف شرب از سد دوستی» از ستون توضیحات
# -----------------------------------------------------------------------------
simaye_ab:
  folder: Bilan
  pattern: "*.pdf"
  assume_deficit: true        # تغییر ذخیره آبخوان همیشه کسری در نظر گرفته شود (بعضی PDFها علامت منفی ندارند)
indicators: simaye_ab         # غیرتجدیدپذیر = −ΔS ؛ آب زیرزمینی در دسترس = تجدیدپذیر زیرزمینی + غیرتجدیدپذیر

# -----------------------------------------------------------------------------
# آمار چاه‌ها
# -----------------------------------------------------------------------------
wells:
  file: CHAH_MASHAHD.xls
  sheet: 0
  columns: {year: سال آبي, county: شهرستان, x: MA_XUTM, y: MA_YUTM, use: نوع مصرف, value: برداشت واقعي}
  value_factor: 0.000001      # مترمکعب -> میلیون مترمکعب
  use_map:
    کشاورزی: کشاورزی
    دام و طیور: کشاورزی
    صنعتی: صنعتی
    خدمات: خدمات
    شرب شهری: شرب
    شرب اشخاص: شرب روستایی
    شرب روستا: شرب روستایی
  unlocated: county_majority  # چاه با مختصات نامعتبر -> زیرحوضه‌ای که بیشتر چاه‌های همان شهرستان در آن است

# -----------------------------------------------------------------------------
# آمار سدهای داخل محدوده (هر سال آبی یک شیت)
#   حجم در دسترس سد = حجم ابتدای سال آبی + ورودی
#   شهرستان سد از ستون «موقعیت» همین فایل؛ زیرحوضه از شیپ‌فایل نقاط سد
# -----------------------------------------------------------------------------
dams:
  file: Amar_SAD.xlsx
  use_map: {کشاورزی: کشاورزی, شرب: شرب, صنعت: صنعتی, سایر: خدمات}
  points: {shapefile: shape/selected_dams.shp, name_field: Name}
  list:
    - {name: سد طرق, aliases: [طرق]}
    - {name: سد کارده, aliases: [کارده]}
    - {name: سد ارداک, aliases: [ارداک چناران, ارداک]}
    - {name: سد چالی دره, aliases: [چالی دره, چالی دره طرقبه]}
    - {name: سد دولت آباد, aliases: [دولت آباد]}

# -----------------------------------------------------------------------------
# آب انتقالی از بیرون محدوده (فقط مشهد: سد دوستی)
#   برداشت = «آب انتقالی جهت مصرف شرب از سد دوستی» در جدول سیمای آب
#   حجم در دسترس = سهم ثابت مشهد از سد دوستی (در اکسل نمونه هم در همه سال‌ها 180 بود)
# -----------------------------------------------------------------------------
transfers:
  - name: سد دوستی
    source: simaye_ab
    field: transfer_in
    use: شرب
    available: 180
    county: مشهد
    sub_basin: 3
